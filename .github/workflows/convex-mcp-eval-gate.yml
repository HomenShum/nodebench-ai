name: Convex MCP Eval Gate

on:
  pull_request:
    paths:
      - 'packages/convex-mcp-nodebench/**'
      - 'scripts/eval-harness/**'
      - '.github/workflows/convex-mcp-eval-gate.yml'
  schedule:
    # Nightly at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of seeds per config'
        default: '3'
        type: string
      tasks:
        description: 'Task filter (tier1/tier2/tier3/all)'
        default: 'tier1'
        type: string
      backend:
        description: 'Requested agent backend (anthropic/openai; execution not yet implemented)'
        default: 'anthropic'
        type: string

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '20'

      - name: Install convex-mcp-nodebench deps
        working-directory: packages/convex-mcp-nodebench
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build convex-mcp-nodebench
        working-directory: packages/convex-mcp-nodebench
        run: npm run build

      - name: Run convex-mcp-nodebench tests
        working-directory: packages/convex-mcp-nodebench
        run: npm test

      - name: List evaluation task catalog (no agent execution)
        run: |
          node packages/convex-mcp-nodebench/node_modules/tsx/dist/cli.mjs scripts/eval-harness/runner.ts --list
          echo "Package build and tests are checked above. This catalog does not certify provider-backed evaluations."

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: scripts/eval-harness/results/
          retention-days: 30
          if-no-files-found: ignore

  nightly-regression:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: eval-gate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '20'

      - name: Install deps
        working-directory: packages/convex-mcp-nodebench
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        working-directory: packages/convex-mcp-nodebench
        run: npm run build

      - name: Require provider-backed evaluation execution
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_BACKEND: ${{ inputs.backend || 'anthropic' }}
          EVAL_SEEDS: ${{ inputs.seeds || '3' }}
          EVAL_TASKS: ${{ inputs.tasks || 'tier1' }}
          EVAL_VERBOSE: 'true'
        run: |
          echo "=== Nightly Eval Suite ==="
          echo "Backend: $EVAL_BACKEND"
          echo "Seeds: $EVAL_SEEDS"
          echo "Tasks: $EVAL_TASKS"
          node packages/convex-mcp-nodebench/node_modules/tsx/dist/cli.mjs scripts/eval-harness/runner.ts --all --tasks "$EVAL_TASKS" --seeds "$EVAL_SEEDS"

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-eval-results
          path: scripts/eval-harness/results/
          retention-days: 90
          if-no-files-found: ignore
